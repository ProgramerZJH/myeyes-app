name: myeyes
description: "视途无忧 - 视障人士辅助应用"
publish_to: 'none' # 防止意外发布到 pub.dev
version: 1.0.0+1 # 版本号格式: major.minor.patch+build_number

environment:
  sdk: '>=3.2.5 <4.0.0' # Flutter SDK版本要求

dependencies:
  flutter_lifecycle_detector: ^0.0.6  # 应用生命周期检测
  network_info_plus: ^5.0.3          # 网络信息获取
  volume_control: ^0.1.5             # 音量控制
  app_settings: ^5.1.1               # 系统设置跳转
  permission_handler: ^11.0.1        # 权限管理
  path_provider: ^2.1.2              # 文件路径管理
  flutter_tts: ^3.8.5               # 文字转语音
  image_picker: ^0.8.3              # 图片选择器
  flutter_vision: ^1.1.4            # YOLOv5目标检测
  flutter:
    sdk: flutter
  geolocator: ^10.1.0               # 地理位置服务
  dio: ^5.4.0                       # 网络请求客户端
  http: ^1.1.0                      # HTTP请求
  cupertino_icons: ^1.0.2           # iOS风格图标
  amap_flutter_map: ^3.0.0          # 高德地图
  amap_flutter_location: ^3.0.0     # 高德定位
  opencv_dart: ^1.3.3               # OpenCV图像处理

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0             # 代码规范检查

flutter:
  assets:
    - assets/                        # 通用资源目录
    - assets/tessdata/              # OCR模型数据目录
  uses-material-design: true        # 使用Material Design
